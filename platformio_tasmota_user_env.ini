[platformio]
core_dir = G:/.platformio
; workspace_dir = G:/.pio

[env:tasmota4M-rule]
extends                 = env:tasmota-4M
build_flags             = ${env:tasmota-4M.build_flags} -DMY_RULE
upload_port             = COM8
monitor_port            = COM8

[env:tasmota4M-script]
extends                 = env:tasmota-4M
board_build.ldscript    = eagle.flash.4m2m.ld
build_flags             = ${env:tasmota-4M.build_flags} -DMY_SCRIPT
upload_port             = COM8
monitor_port            = COM8

[env:tasmota32-script]
extends                 = env:tasmota32
build_flags             = ${env:tasmota32.build_flags} -DMY_SCRIPT
; board_build.partitions  = partitions/esp32_partition_app1856k_fs1344k.csv
board_build.partitions  = partitions/esp32_partition_app2880k_fs320k.csv
upload_port             = COM8
monitor_port            = COM8

[env:tasmota32-berry]
extends                 = env:tasmota32
build_flags             = ${env:tasmota32.build_flags} -DMY_BERRY
; board_build.partitions  = partitions/esp32_partition_app1856k_fs1344k.csv
board_build.partitions  = partitions/esp32_partition_app2880k_fs320k.csv
upload_port             = COM6
monitor_port            = COM6

[env:tasmota32-ETH01-script]    ; https://templates.blakadder.com/wireless_tag_WT32-ETH01.html
; https://en.wireless-tag.com/product-item-2.html
; das Board hat 8 MB externen Flash eingebaut
extends                 = env:tasmota32
; board                   = esp32-fix     ; https://github.com/arendst/Tasmota/discussions/16423
build_flags             = ${env:tasmota32.build_flags} -DMY_SCRIPT -DMY_ETH01
; board_build.partitions  = partitions/esp32_partition_app2880k_fs320k.csv
board_build.partitions  = partitions/esp32_partition_app3904k_fs3392k.csv
upload_port             = COM8
monitor_port            = COM8

[env:tasmota32c3-luatos-script]    ; https://wiki.luatos.org/chips/esp32c3/board.html + https://wiki.luatos.org/peripherals/lcd_air10x/index.html
; das Board hat 4 MB externen Flash eingebaut; event. erhöhen auf 8 MB (w25q64)
extends                 = env:tasmota32c3
build_flags             = ${env:tasmota32c3.build_flags} -DMY_SCRIPT -DLUATOS_ESP32C3
; board_build.partitions  = partitions/esp32_partition_app1856k_fs1344k.csv
board_build.partitions  = partitions/esp32_partition_app2880k_fs320k.csv
upload_port             = COM9
monitor_port            = COM9

[env:tasmota32s3-zero-berry]      ; https://www.waveshare.com/wiki/ESP32-S3-Zero
; ACHTUNG: G:\.platformio\packages\framework-arduinoespressif32\tools\esp32-arduino-libs\esp32s3\bin\bootloader_qio_40m.elf ist vom ESP32S2 !!!
extends                 = env:tasmota32s3
board                   = esp32-s3-devkitc-1
; board = waveshare-esp32-s3-zero-1
board_build.variant = waveshare_esp32_s3_zero
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions  = partitions/esp32_partition_app2880k_fs320k.csv
build_flags = ${env:tasmota32.build_flags} -D MY_BERRY -D ESP32Sx
  -D BOARD_HAS_PSRAM
monitor_port = COM17
monitor_speed = 115200
